<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 38 1000 262" width="1000" height="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Sources are recorded, transcribed and diarized in parallel, summarized, then filed to Obsidian">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C959F"/></marker></defs>
<text x="20" y="62" font-size="13" font-weight="600" fill="#59636E" text-anchor="start">Sources</text>
<rect x="20" y="80" width="190" height="36" rx="18" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<circle cx="40" cy="98" r="6" fill="#EB6834"/>
<text x="56" y="103" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start">Microphone</text>
<rect x="20" y="126" width="190" height="36" rx="18" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<circle cx="40" cy="144" r="6" fill="#2A78D6"/>
<text x="56" y="149" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start">System audio</text>
<rect x="20" y="172" width="190" height="36" rx="18" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<circle cx="40" cy="190" r="6" fill="#1BAF7A"/>
<text x="56" y="195" font-size="14" font-weight="400" fill="#1F2328" text-anchor="start">Apps (Zoom, Teams)</text>
<line x1="214" y1="150" x2="252" y2="150" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<rect x="256" y="80" width="160" height="128" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<circle cx="279" cy="106" r="7" fill="#E5484D"/>
<text x="294" y="111" font-size="16" font-weight="600" fill="#1F2328" text-anchor="start">Record</text>
<text x="276" y="140" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">Earshot app</text>
<text x="276" y="160" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">a track per source</text>
<text x="276" y="180" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">mixed to one WAV</text>
<text x="336" y="232" font-size="12" font-weight="400" fill="#59636E" text-anchor="middle">on Record, or when a</text>
<text x="336" y="248" font-size="12" font-weight="400" fill="#59636E" text-anchor="middle">Zoom or Teams call starts</text>
<line x1="420" y1="150" x2="458" y2="150" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<rect x="462" y="62" width="210" height="164" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="567" y="84" font-size="12" font-weight="600" fill="#59636E" text-anchor="middle">In parallel, on the GPU</text>
<rect x="476" y="96" width="182" height="50" rx="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="492" y="118" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Transcribe</text>
<text x="492" y="136" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">MLX Whisper</text>
<rect x="476" y="158" width="182" height="50" rx="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="492" y="180" font-size="15" font-weight="600" fill="#1F2328" text-anchor="start">Speakers</text>
<text x="492" y="198" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">pyannote</text>
<line x1="676" y1="150" x2="714" y2="150" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<rect x="718" y="80" width="140" height="128" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
<text x="736" y="111" font-size="16" font-weight="600" fill="#1F2328" text-anchor="start">Summarize</text>
<text x="736" y="140" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">meeting, lecture,</text>
<text x="736" y="160" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">brief or your own</text>
<text x="736" y="180" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">local or Claude*</text>
<line x1="862" y1="150" x2="892" y2="150" stroke="#8C959F" stroke-width="2" marker-end="url(#a)"/>
<rect x="896" y="80" width="94" height="128" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="943" y="111" font-size="15" font-weight="600" fill="#1F2328" text-anchor="middle">Obsidian</text>
<text x="943" y="140" font-size="13" font-weight="400" fill="#59636E" text-anchor="middle">a note in</text>
<text x="943" y="160" font-size="13" font-weight="400" fill="#59636E" text-anchor="middle">your vault</text>
<text x="943" y="180" font-size="13" font-weight="400" fill="#59636E" text-anchor="middle">(optional)*</text>
<text x="20" y="288" font-size="12" font-weight="400" fill="#59636E" text-anchor="start">Audio never leaves your Mac.  * Claude, if you choose it for summaries or Obsidian filing, sees transcript text only.</text>
